plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.idol.prank.call.chat.video'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.idol.prank.call.chat.video"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.process
    implementation libs.firebase.analytics
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    //circular imageview
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //picasso
    implementation 'com.squareup.picasso:picasso:2.71828'
    //material
    implementation 'com.google.android.material:material:1.8.0-alpha01'
    //ssp and sdp

    implementation 'com.intuit.ssp:ssp-android:1.1.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    //shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //Lottie Animation
    def lottieVersion = "5.0.3"
    implementation "com.airbnb.android:lottie:$lottieVersion"

    // circle indicator
    implementation 'me.relex:circleindicator:2.1.6'
    //slider
//    implementation 'com.github.alirezat775:carousel-view:1.1.1'

//    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.22'

//    implementation 'com.ebanx:swipe-button:0.4.0'
    implementation "com.ncorti:slidetoact:0.9.0"

    implementation 'com.google.android.material:material:1.7.0'

    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'androidx.annotation:annotation:1.0.0'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation("com.google.android.gms:play-services-ads:24.8.0")
    implementation project(':nativetemplate')
    implementation 'androidx.multidex:multidex:2.0.1'
}